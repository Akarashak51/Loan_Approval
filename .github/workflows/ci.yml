name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLASK_ENV: testing
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install document extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr poppler-utils
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt flake8==7.4.1
      - name: Lint backend and ML
        run: python -m flake8 backend ml --extend-exclude=venv,.venv --count --statistics
      - name: Run backend and ML tests
        run: python -m pytest tests/backend tests/ml -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test frontend
        working-directory: frontend
        run: npm test
